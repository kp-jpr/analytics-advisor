server:
  port: 8080

spring:
  application:
    name: srse-backend
  # NOTE: two datasources are defined in code (Operational/Analytical
  # DataSourceConfig). Spring Boot auto-datasource is bypassed intentionally.
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

# ---- Operational plane: PostgreSQL or DB2 (JPA) — decision 0.1 ----
srse:
  external-sources:
    # Base64-encoded 32-byte AES key. Required only when external source credentials are saved.
    secret-key: ${SRSE_EXTERNAL_SOURCE_SECRET_KEY:}
  datasource:
    operational:
      jdbc-url: ${SRSE_OPERATIONAL_JDBC_URL:${SRSE_DB2_URL:jdbc:postgresql://localhost:5433/srse}}
      username: ${SRSE_OPERATIONAL_USER:${SRSE_DB2_USER:srse}}
      password: ${SRSE_OPERATIONAL_PASSWORD:${SRSE_DB2_PASSWORD:srse_local_pw}}
      driver-class-name: ${SRSE_OPERATIONAL_DRIVER:${SRSE_DB2_DRIVER:org.postgresql.Driver}}
    # ---- Analytical plane: PrestoDB (JDBC) ----
    analytical:
      jdbc-url: ${SRSE_PRESTO_URL:jdbc:presto://localhost:8081/iceberg/srse}
      username: ${SRSE_PRESTO_USER:srse}
      # Blank by default — local/synthetic Presto has no auth. A live
      # watsonx.data endpoint with password auth needs SRSE_PRESTO_PASSWORD set.
      password: ${SRSE_PRESTO_PASSWORD:}
      driver-class-name: com.facebook.presto.jdbc.PrestoDriver
    # SSL is deliberately NOT bound through data-source-properties here — the
    # Presto JDBC driver rejects SSLTrustStorePath as a connection property
    # whenever it's present, even as an empty string (SQLException: "Connection
    # property 'SSLTrustStorePath' is not allowed"), so it can't just default
    # to blank like a normal Hikari property. AnalyticalDataSourceConfig reads
    # these directly and only adds the driver properties when ssl.enabled=true.
    analytical-ssl:
      enabled: ${SRSE_PRESTO_SSL:false}
      trust-store-path: ${SRSE_PRESTO_TRUSTSTORE_PATH:}
      trust-store-password: ${SRSE_PRESTO_TRUSTSTORE_PASSWORD:}
  data-mode: ${DATA_MODE:synthetic}
  # Optional display name for the running deployment (UAT, Staging, etc.).
  # Does not change DATA_MODE — UI only.
  environment-label: ${SRSE_ENV_LABEL:}
  auth-mode: ${SRSE_AUTH_MODE:mock}
  bootstrap:
    super-admin-password: ${SRSE_BOOTSTRAP_SUPER_ADMIN_PASSWORD:}
  otp:
    sender: ${SRSE_OTP_SENDER:log}
    code-ttl-minutes: ${SRSE_OTP_TTL_MINUTES:5}
    max-verify-attempts: ${SRSE_OTP_MAX_ATTEMPTS:5}
    resend-cooldown-seconds: ${SRSE_OTP_RESEND_COOLDOWN_SECONDS:60}
  # Session policy (decision A14). Idle timeout 0 disables the idle check.
  session:
    absolute-lifetime: ${SRSE_SESSION_ABSOLUTE_LIFETIME:8h}
    idle-timeout: ${SRSE_SESSION_IDLE_TIMEOUT:30m}
    activity-write-interval: ${SRSE_SESSION_ACTIVITY_WRITE_INTERVAL:1m}
    # Base64, >= 32 bytes. Required when auth-mode=local; blank = random per boot (mock only).
    signing-key: ${SRSE_SESSION_SIGNING_KEY:}
  identity:
    lockout:
      max-failed-attempts: ${SRSE_IDENTITY_LOCKOUT_MAX_ATTEMPTS:5}
      lock-duration-minutes: ${SRSE_IDENTITY_LOCKOUT_MINUTES:15}
    password:
      expiry-days: ${SRSE_IDENTITY_PASSWORD_EXPIRY_DAYS:90}
    bootstrap:
      super-admin-username: ${SRSE_BOOTSTRAP_SUPER_ADMIN_USERNAME:superadmin}
  # Comma-separated list of origins the browser loads the frontend from —
  # CORS rejects everything else. Must match the ACTUAL URL the browser uses,
  # not a Docker-internal hostname. See SecurityConfig#corsConfigurationSource.
  frontend-origins: ${SRSE_FRONTEND_ORIGINS:http://localhost:3000}
  guardrails:
    cohort-cap: ${SRSE_COHORT_CAP:1000}
    query-timeout-seconds: ${SRSE_QUERY_TIMEOUT_SECONDS:180}
    metadata-timeout-seconds: ${SRSE_METADATA_TIMEOUT_SECONDS:15}
    preview-sample-size: ${SRSE_PREVIEW_SAMPLE_SIZE:50}
  audit:
    # Immediate peers (load balancers) allowed to supply X-Forwarded-For.
    # Empty = never trust the header (safe default on a laptop). Set behind a load balancer.
    trusted-proxies: []
    # Reported to the audit viewer; no purge job runs in this release (§7.3.2).
    retention-days: ${SRSE_AUDIT_RETENTION_DAYS:365}
  monitoring:
    max-running: ${SRSE_MONITORING_MAX_RUNNING:1000}
    recent-minutes: ${SRSE_MONITORING_RECENT_MINUTES:30}
  metadata:
    sync:
      enabled: ${SRSE_METADATA_SYNC_ENABLED:true}
      cron: ${SRSE_METADATA_SYNC_CRON:0 0 2 * * SUN}
    snapshot:
      ttl-days: ${SRSE_METADATA_SNAPSHOT_TTL_DAYS:7}
  scope:
    max-in-values: ${SRSE_SCOPE_MAX_IN_VALUES:1000}
  analysis:
    max-target-sets: ${SRSE_ANALYSIS_MAX_TARGET_SETS:5}
    multi-match-budget-seconds: ${SRSE_ANALYSIS_MULTI_MATCH_BUDGET_SECONDS:120}
    max-group-columns: ${SRSE_ANALYSIS_MAX_GROUP_COLUMNS:4}
    max-any-of-groups-per-side: ${SRSE_ANALYSIS_MAX_ANYOF_GROUPS:2}
    max-probed-pairs: ${SRSE_ANALYSIS_MAX_PROBED_PAIRS:10}
    blocking-prefix-len: ${SRSE_ANALYSIS_BLOCKING_PREFIX_LEN:3}
    max-estimated-rows: ${SRSE_ANALYSIS_MAX_ESTIMATED_ROWS:50000000}
    join-key-distinctness-timeout-seconds: ${SRSE_ANALYSIS_JOIN_KEY_DISTINCTNESS_TIMEOUT_SECONDS:10}
    max-column-distinct-values: ${SRSE_ANALYSIS_MAX_COLUMN_DISTINCT_VALUES:100}
    max-extract-result-limit: ${SRSE_ANALYSIS_MAX_EXTRACT_RESULT_LIMIT:100000}
  breakdown:
    age-band-column: ${SRSE_AGE_BAND_COLUMN:age_band}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local
# Local dev without live Presto — allow Hikari pools to start even if DBs are down,
# and fail connection attempts fast (3s) instead of Hikari's 30s default.
srse:
  datasource:
    operational:
      initialization-fail-timeout: -1
      connection-timeout: 3000
    analytical:
      initialization-fail-timeout: -1
      connection-timeout: 3000
